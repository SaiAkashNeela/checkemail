name: Publish checkemail to npm

on:
  # Run every Monday and Thursday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 9 * * 4'

  # Manual trigger — the "Run workflow" button in GitHub Actions UI
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/checkemail

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Fetch latest disposable domains list
        run: |
          echo "Fetching latest disposable domain list..."
          curl -fsSL \
            "https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/main/disposable_email_blocklist.conf" \
            -o data/disposable.txt
          COUNT=$(wc -l < data/disposable.txt | tr -d ' ')
          echo "Loaded $COUNT domains."

      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Commit updated list + version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/disposable.txt package.json
          git diff --staged --quiet || git commit -m "chore: update disposable list + bump to v${{ steps.version.outputs.version }}"
          git push
        working-directory: ${{ github.workspace }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Note: Bun doesn't have a native publish command yet, so we use npm just for this step

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/checkemail:latest
            ${{ secrets.DOCKER_USERNAME }}/checkemail:${{ steps.version.outputs.version }}
