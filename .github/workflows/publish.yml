name: Publish checkemail to npm

on:
  # Run every Monday and Thursday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 9 * * 4'

  # Manual trigger — the "Run workflow" button in GitHub Actions UI
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json # packageManager field, same Bun as development

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Update npm to latest (required for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Fetch latest disposable domains list
        run: |
          echo "Fetching latest disposable domain list..."
          curl -fsSL \
            "https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/main/disposable_email_blocklist.conf" \
            -o data/disposable.txt
          COUNT=$(wc -l < data/disposable.txt | tr -d ' ')
          echo "Loaded $COUNT domains."
          # Refuse to ship a truncated or wrong file (the list has 10,000+ lines)
          if [ "$COUNT" -lt 5000 ]; then echo "::error::Only $COUNT lines in disposable list, aborting"; exit 1; fi
          if grep -qvE '^([a-z0-9.-]+|#.*)?$' data/disposable.txt; then echo "::error::Unexpected line in disposable list, aborting"; exit 1; fi

      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Nothing is committed, pushed or published unless the tests pass
      - name: Test
        run: bun run test

      - name: Commit updated list + version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/disposable.txt package.json
          git diff --staged --quiet || git commit -m "chore: update disposable list + bump to v${{ steps.version.outputs.version }}"
          git push
        working-directory: ${{ github.workspace }}

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public
          else
            npm publish --provenance --access public
          fi

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        if: env.DOCKER_USERNAME != ''
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/checkemail:latest
            ${{ secrets.DOCKER_USERNAME }}/checkemail:${{ steps.version.outputs.version }}
